<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chemp | idea generator</title>
    <style>
        :root {
            --bg-color: #0d0f18;
            --surface-color: #16192b;
            --accent-color: #ff2a6d;
            --accent-secondary: #05d9e8;
            --text-color: #f4f4f9;
            --text-muted: #8c92ac;
            --border-color: rgba(255, 42, 109, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* top navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(13, 15, 24, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            z-index: 1000;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent-color);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
            position: relative;
            padding: 4px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-color);
            transition: width 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--text-color);
        }

        nav a:hover::after, nav a.active::after {
            width: 100%;
        }

        /* main content */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(5, 217, 232, 0.1);
            border: 1px solid rgba(5, 217, 232, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--accent-secondary);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInScale 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1rem;
            letter-spacing: -1.5px;
            opacity: 0;
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        h1 span {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 42, 109, 0.3);
        }

        button:hover {
            background-color: #e0205d;
            transform: translateY(-2px);
        }

        #idea-box {
            font-size: 1.1rem;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            background: #0d0f18;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* entrance animations */
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeInScale {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <!-- top navigation bar -->
    <header>
        <a href="index.html" class="logo">verikoolguy's stuff</a>
        <nav>
            <a href="index.html">home</a>
            <a href="projects.html">projects</a>
            <a href="about.html">about</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <!-- main content -->
    <main>
        <div class="page-header">
            <div class="page-badge">generator tool</div>
            <h1>chemp <span>idea generator</span></h1>
        </div>

        <div class="container">
            <button onclick="getRandomIdea()">roll a build idea</button>
            <div id="idea-box">hit the button to pull a building concept...</div>
        </div>
    </main>

    <footer>
        <p>built with github pages</p>
    </footer>

    <script>
        const buildingIdeas = [
            "design a vertical parkour obstacle course using floating platforms.",
            "build a zero-gravity floating arena with bouncy walls.",
            "construct a futuristic cyberpunk neon highway complete with speed pads and ramps.",
            "design an interactive pinball machine where players act as the ball inside a giant arena.",
            "construct a skate park bowl with half-pipes, rails, and launch ramps for high-speed runs.",
            "design a sci-fi elevator shaft that moves up and down using custom physics forces.",
            "create a giant floating island base accessible only by a precise parkour jump sequence.",
            "construct a rollercoaster track layout using connected physics segments and steep drops.",
            "design a massive maze with false walls and dead ends.",
            "construct a giant statue monument dedicated to the community's wildest physics bugs.",
            "design a floating airship vessel with propeller props and an open deck layout.",
            "construct a bouncy trampoline park with tiered jumping platforms of varying elasticity.",
            "design a high-speed racing track featuring hairpin turns, boost pads, and jump gaps.",
            "construct a cozy treehouse village connected by suspended rope bridges and platforms.",
            "build an industrial factory warehouse with crane props.",
            "construct a giant chessboard arena where players can interact with oversized pieces.",
            "design a space station interior corridor with zero-gravity floating zones and airlocks.",
            "create an abandoned hospital ward with debris and spooky ambience.",
            "construct a gigantic mega-ramp stunt course ending in a massive pool of bouncing physics toys.",
            "build a subterranean cave system with jumping platforms and stable stone layouts.",
            "construct a giant bowling alley where players roll massive physics spheres down a long lane into stacked blocks.",
            "build a towering spiral staircase tower reaching all the way to the top of the map boundary.",
            "design a stunt arena featuring multiple looping ramps and jump gaps for high-speed runs.",
            "construct a massive platforming puzzle built out of stacked crates and floating panels.",
            "build a bouncy castle zone enclosed entirely by high-elasticity trampoline walls.",
            "design a giant labyrinth maze built entirely out of tall upright wall props.",
            "construct a suspended rope bridge pathway crossing a massive open drop zone.",
            "build an indoor skate park layout featuring half-pipes, rails, and launch wedges.",
            "design a towering column structure built from interlocking circular disk props.",
            "construct a multi-tiered garage building complete with ramps connecting each parking level.",
            "build a massive domino course using stacked upright panels in a winding pattern across the floor.",
            "design an open-air amphitheater featuring tiered seating steps and a central stage platform.",
            "construct a giant slide course starting from a high ledge and winding down to the main floor.",
            "build a precision jumping course made of tiny, floating square block platforms.",
            "design a heavy-duty cargo loading dock area stacked with crates, pallets, and shipping containers.",
            "construct a giant pyramid structure built out of solid stacking physics blocks.",
            "build a symmetrical stone temple ruin featuring standing pillar props and archways.",
            "design a vertical climbing wall packed with hand-hold props leading to a sky platform.",
            "construct a bouncy trampoline gauntlet course testing player momentum and air control.",
            "build a massive open arena floor littered with hundreds of loose physics objects for chaotic sandbox testing."
        ];

        function getRandomIdea() {
            const randomIndex = Math.floor(Math.random() * buildingIdeas.length);
            const box = document.getElementById('idea-box');
            box.style.color = 'var(--text-color)';
            box.innerText = buildingIdeas[randomIndex];
        }
    </script>

</body>
</html>
